name: Monitor annual reports

on:
  schedule:
    - cron: "20 6 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor-annual-reports:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install annual report text extraction dependency
        run: python -m pip install "pypdf>=6,<7" "cryptography>=45,<46" "curl-cffi>=0.13,<0.14"

      - name: Monitor annual report source pages
        run: >-
          python scripts/monitor_annual_reports.py
          --max-sources-per-company 4
          --max-child-pages-per-company 1
          --timeout 8
          --workers 12

      - name: Extract genuine annual report keyword counts
        shell: bash
        run: |
          cp annual-reports/extracted-keywords.json "$RUNNER_TEMP/previous-extractions.json"
          python scripts/extract_annual_report_keywords.py \
            --latest-only \
            --workers 4 \
            --output "$RUNNER_TEMP/current-extractions.json"
          python scripts/extract_annual_report_keywords.py \
            --latest-only \
            --merge-input "$RUNNER_TEMP/previous-extractions.json" \
            --merge-input "$RUNNER_TEMP/current-extractions.json" \
            --output annual-reports/extracted-keywords.json

      - name: Build customer company reports
        run: python automation/build_company_reports.py

      - name: Commit annual report monitoring updates
        shell: bash
        run: |
          git config user.name "stocklayer-annual-report-bot"
          git config user.email "stocklayer-annual-report-bot@users.noreply.github.com"

          git add annual-reports/*.json
          git commit -m "Update annual report monitoring" || echo "No annual report changes to commit"

          # These feeds were built before any concurrent data update was incorporated.
          # Discard only the generated copies; they are rebuilt after the rebase below.
          git restore company-reports

          # Daily sentiment may update main during the slower PDF extraction.
          # Rebase onto that data, rebuild the combined feeds, and retry a raced push.
          for attempt in 1 2 3; do
            git pull --rebase origin main
            python automation/build_company_reports.py
            git add company-reports/*.json
            git commit -m "Rebuild customer company reports" || echo "No company report changes to commit"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push raced another data workflow; retrying ($attempt/3)."
            sleep 5
          done
          exit 1
