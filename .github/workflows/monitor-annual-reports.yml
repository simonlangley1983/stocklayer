name: Monitor annual reports

on:
  schedule:
    # Routine collection checks verified sources once each morning. Historical
    # recovery is deliberately manual: it is network-heavy and low-yield.
    - cron: "20 6 * * *"
  workflow_dispatch:
    inputs:
      historical:
        description: "Run broad discovery and historical recovery"
        type: boolean
        default: false
      extraction_only:
        description: "Extract verified indexed reports without repeating the full crawl"
        type: boolean
        default: false

concurrency:
  group: annual-report-collection
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  monitor-annual-reports:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install annual report text extraction dependency
        run: python -m pip install "pypdf>=6,<7" "cryptography>=45,<46" "curl-cffi>=0.13,<0.14"

      - name: Test backfill queue and timeout safeguards
        run: |
          python scripts/test_annual_backfill.py
          python scripts/test_report_discovery.py

      - name: Build annual report register
        run: python scripts/build_report_register.py

      - name: Extract already indexed reports before discovery
        run: python scripts/backfill_annual_reports.py --batch-size 24 --workers 8 --report-timeout 90 --latest-only

      - name: Monitor annual report source pages
        timeout-minutes: 5
        continue-on-error: true
        if: ${{ !inputs.extraction_only }}
        run: >-
          python scripts/monitor_annual_reports.py
          --registered-sources-only
          --max-sources-per-company 1
          --max-child-pages-per-company 1
          --timeout 5
          --workers 20

      - name: Discover FCA-filed annual reports
        if: ${{ !inputs.extraction_only }}
        run: python scripts/discover_fca_reports.py --start-year 2020

      - name: Extract verified manually supplied reports
        run: python scripts/backfill_annual_reports.py --ticker BTRW.L --batch-size 8 --workers 4 --report-timeout 90 --start-year 2021

      - name: Discover historical archive reports
        if: ${{ inputs.historical && !inputs.extraction_only }}
        run: python scripts/discover_annualreports_archive.py --start-year 2020 --timeout 8 --max-failures 8

      - name: Extract newly discovered archive reports
        run: python scripts/backfill_annual_reports.py --batch-size 24 --workers 8 --report-timeout 90 --latest-only

      - name: Backfill a resumable batch of missing annual reports
        run: python scripts/backfill_annual_reports.py --batch-size 24 --workers 8 --report-timeout 90 --latest-only --fca-only

      - name: Recover historical reports after latest-year priority work
        if: ${{ inputs.historical }}
        run: python scripts/backfill_annual_reports.py --batch-size 24 --workers 8 --report-timeout 90 --start-year 2020

      - name: Build customer company reports
        run: |
          python scripts/build_report_register.py
          python automation/build_company_reports.py

      - name: Refresh growth-confidence scores from new intelligence
        run: python scripts/generate_growth_confidence_history.py --companies uk-companies.json

      - name: Preserve report extraction diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: annual-report-extraction-diagnostics
          path: |
            annual-reports/backfill-state.json
            annual-reports/backfill-progress.json
          if-no-files-found: warn
          retention-days: 14

      - name: Summarise annual report coverage
        run: python scripts/check_annual_report_coverage.py

      - name: Commit annual report monitoring updates
        shell: bash
        run: |
          git config user.name "stocklayer-annual-report-bot"
          git config user.email "stocklayer-annual-report-bot@users.noreply.github.com"

          git add annual-reports/*.json annual-reports/coverage-summary.md history/growth-confidence/*.json
          git commit -m "Update annual report monitoring" || echo "No annual report changes to commit"

          # These feeds were built before any concurrent data update was incorporated.
          # Discard only the generated copies; they are rebuilt after the rebase below.
          git restore company-reports

          # Daily sentiment may update main during the slower PDF extraction.
          # Rebase onto that data, rebuild the combined feeds, and retry a raced push.
          for attempt in 1 2 3; do
            git pull --rebase origin main
            python automation/build_company_reports.py
            git add company-reports/*.json
            git commit -m "Rebuild customer company reports" || echo "No company report changes to commit"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push raced another data workflow; retrying ($attempt/3)."
            sleep 5
          done
          exit 1

      - name: Alert on declining or stalled coverage
        run: python scripts/check_annual_report_coverage.py --enforce
