name: Monitor annual reports

on:
  schedule:
    - cron: "20 6 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor-annual-reports:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Monitor annual report source pages
        run: python scripts/monitor_annual_reports.py

      - name: Commit annual report monitoring updates
        run: |
          if git diff --quiet -- annual-reports/*.json; then
            echo "No annual report monitoring changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add annual-reports/*.json
          git commit -m "Update annual report monitoring"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
