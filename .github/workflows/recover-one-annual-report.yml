name: Recover one annual report

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: single-annual-report-recovery
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  recover-one-report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install "pypdf>=6,<7" "cryptography>=45,<46" "curl-cffi>=0.13,<0.14"

      - name: Recover exactly one outstanding indexed report
        run: >-
          python scripts/backfill_annual_reports.py
          --batch-size 1 --workers 1 --report-timeout 90 --start-year 2020 --end-year 2024
          --result-file annual-reports/last-recovery-result.json

      - name: Update affected confidence score only when new data was added
        id: result
        shell: bash
        run: |
          if [ "$(jq -r '.newDataAdded' annual-reports/last-recovery-result.json)" = "true" ]; then
            for slug in $(jq -r '.companySlugs[]' annual-reports/last-recovery-result.json); do
              python scripts/generate_growth_confidence_history.py --companies uk-companies.json --slug "$slug"
            done
          fi
          git config user.name "stocklayer-annual-report-bot"
          git config user.email "stocklayer-annual-report-bot@users.noreply.github.com"
          git add annual-reports/*.json history/growth-confidence/*.json
          git commit -m "Recover one annual report" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
