name: Recover historical annual-report gaps

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

concurrency:
  group: historical-annual-report-recovery
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  recover-one-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install "pypdf>=6,<7" "cryptography>=45,<46" "curl-cffi>=0.13,<0.14"

      - name: Discover a rotating batch of genuine historical gaps
        shell: bash
        run: >-
          python scripts/discover_annualreports_archive.py
          --start-year 2020 --end-year $(( $(date -u +%Y) - 1 )) --missing-only --limit 1
          --offset $(( (${{ github.run_number }} - 1) % 58 )) --timeout 20 --retries 1 --max-failures 1

      - name: Validate and extract newly discovered reports
        run: >-
          python scripts/backfill_annual_reports.py
          --batch-size 1 --workers 1 --report-timeout 120 --start-year 2020 --end-year $(( $(date -u +%Y) - 1 ))
          --result-file annual-reports/last-recovery-result.json

      - name: Refresh confidence and customer reports after extraction
        id: result
        shell: bash
        run: |
          if [ "$(jq -r '.newDataAdded' annual-reports/last-recovery-result.json)" = "true" ]; then
            for slug in $(jq -r '.companySlugs[]' annual-reports/last-recovery-result.json); do
              python scripts/generate_growth_confidence_history.py --companies uk-companies.json --slug "$slug"
            done
          fi
          report_updated=$(jq -r '.generated_at // empty' annual-reports/extracted-keywords-history.json)
          feed_updated=$(jq -r '.generatedAt // empty' company-reports/manifest.json)
          if [ -n "$report_updated" ]; then
            report_epoch=$(date -u -d "$report_updated" +%s)
            feed_epoch=0
            if [ -n "$feed_updated" ]; then
              feed_epoch=$(date -u -d "$feed_updated" +%s)
            fi
            if [ "$report_epoch" -gt "$feed_epoch" ]; then
              python automation/build_company_reports.py
            fi
          fi
          git config user.name "stocklayer-annual-report-bot"
          git config user.email "stocklayer-annual-report-bot@users.noreply.github.com"
          git add annual-reports/*.json history/growth-confidence/*.json company-reports/*.json
          git commit -m "Recover historical annual-report gaps" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

