name: Recover one annual report

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: single-annual-report-recovery
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  recover-one-report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install "pypdf>=6,<7" "cryptography>=45,<46" "curl-cffi>=0.13,<0.14"

      - name: Select exactly one company
        id: company
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, time
          companies = json.load(open("uk-companies.json", encoding="utf-8"))
          company = companies[int(time.time() // 600) % len(companies)]
          print(f"ticker={company['ticker']}")
          print(f"company={company['companyName']}")
          PY

      - name: Find one company's archive reports
        run: >-
          python scripts/discover_annualreports_archive.py
          --ticker "${{ steps.company.outputs.ticker }}"
          --start-year 2020 --timeout 8 --retries 0 --max-failures 1 --delay 0

      - name: Extract at most one report
        run: >-
          python scripts/backfill_annual_reports.py
          --ticker "${{ steps.company.outputs.ticker }}"
          --batch-size 1 --workers 1 --report-timeout 90 --start-year 2020

      - name: Rebuild scores and publish changes
        shell: bash
        run: |
          python scripts/build_report_register.py
          python automation/build_company_reports.py
          python scripts/generate_growth_confidence_history.py --companies uk-companies.json
          git config user.name "stocklayer-annual-report-bot"
          git config user.email "stocklayer-annual-report-bot@users.noreply.github.com"
          git add annual-reports/*.json company-reports/*.json history/growth-confidence/*.json
          git commit -m "Recover one annual report: ${{ steps.company.outputs.ticker }}" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
