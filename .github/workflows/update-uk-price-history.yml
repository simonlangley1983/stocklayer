name: Update UK prices and historical returns

on:
  schedule:
    - cron: '20 7-17 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-uk-price-history
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check return calculations
        run: python -m unittest discover -s tests -p 'test_uk_price_history.py'
      - name: Refresh 100 UK companies and price histories
        run: python scripts/update_uk_price_history.py
      - name: Install global market-cap dependencies
        run: python -m pip install yfinance curl_cffi
      - name: Validate global market-cap matching
        run: python -m unittest discover -s tests -p 'test_global_market_caps.py'
      - name: Refresh and validate all global market-cap ranks
        run: python scripts/update_global_market_caps.py
      - name: Commit refreshed data
        run: |
          git config user.name 'stocklayer-bot'
          git config user.email 'stocklayer-bot@users.noreply.github.com'
          git add uk-companies.json history/*-history.json history/global-market-cap-ranks.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh UK quotes and dated historical returns'
          git pull --rebase
          git push
